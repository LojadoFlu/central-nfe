# Deploy do front (Next.js App Router) na Netlify — mesmo padrão dos apps irmãos.
# Certificado digital e integração SEFAZ NÃO rodam aqui: vivem nas Cloud Functions.
[build]
  command = "npm run typecheck && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # A config de CLIENTE do Firebase (apiKey, appId, projectId…) é PÚBLICA por
  # design — vai ao navegador de qualquer forma; a segurança vem das Security
  # Rules + Auth, não de esconder a chave. Evita falso-positivo do scanner.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"

[[plugins]]
  package = "@netlify/plugin-nextjs"
